name: gitleaks

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      scan_history:
        description: Run full Git history scan instead of current working tree scan
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      SCAN_HISTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_history || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SCAN_HISTORY}" = "true" ]; then
            gitleaks git --source . --redact --verbose
          else
            gitleaks dir --source . --redact --verbose
          fi